name: Release openGauss Fork

on:
  push:
    tags:
      - 'v*-og.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.21.4-og.1'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      REL_VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install qemu
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y qemu-user

      - name: Normalize version
        run: |
          ver="${REL_VERSION#v}"
          echo "REL_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Build release artifact
        run: |
          chmod +x ./build-opengauss.sh
          ./build-opengauss.sh -a ${{ matrix.arch }} -v "$REL_VERSION"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opengauss-release-${{ matrix.arch }}
          path: build/linux/${{ matrix.arch }}/${{ env.REL_VERSION }}/*
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    env:
      REL_VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Normalize version
        run: |
          ver="${REL_VERSION#v}"
          echo "REL_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate checksums
        run: |
          find dist -type f \( -name '*.tar.bz2' -o -name 'gausssql' \) -print0 | sort -z | xargs -0 sha256sum | tee dist/sha256sum.txt

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.REL_VERSION }}
          name: gausssql ${{ env.REL_VERSION }}
          draft: true
          generate_release_notes: true
          files: |
            dist/**/*.tar.bz2
            dist/sha256sum.txt
            dist/**/sha256sum.txt
