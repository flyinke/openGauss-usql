name: openGauss CI

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'feature/**'
  pull_request:

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install qemu
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y qemu-user

      - name: Build openGauss artifact
        run: |
          chmod +x ./build-opengauss.sh
          ./build-opengauss.sh -a ${{ matrix.arch }} -v 0.21.4-og.1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opengauss-linux-${{ matrix.arch }}
          path: build/linux/${{ matrix.arch }}/0.21.4-og.1/*
          if-no-files-found: error

  smoke:
    name: Smoke Test amd64
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install qemu
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y qemu-user

      - name: Build amd64 for smoke test
        run: |
          chmod +x ./build-opengauss.sh
          ./build-opengauss.sh -a amd64 -v 0.21.4-og.1

      - name: Verify version output
        run: |
          build/linux/amd64/0.21.4-og.1/gausssql --version | tee /tmp/gausssql-version.txt
          grep -q 'gausssql 0.21.4-og.1' /tmp/gausssql-version.txt

      - name: Verify opengauss scheme is recognized
        run: |
          set +e
          build/linux/amd64/0.21.4-og.1/gausssql 'opengauss://root:pw@127.0.0.1:1/postgres?sslmode=disable' -c 'select 1' > /tmp/gausssql-smoke.log 2>&1
          status=$?
          set -e
          test $status -ne 0
          ! grep -q 'unknown database scheme' /tmp/gausssql-smoke.log
